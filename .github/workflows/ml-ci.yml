name: Student Performance ML CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-docker:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7


      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'


      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip


      # 4. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt


      # 5. Train ML model
      - name: Train student performance model
        run: python train_model.py


      # 6. Check ML quality gate
      - name: Check ML quality gate
        run: python quality_gate.py


      # 7. Run ML pipeline tests
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v


      # 8. Run Flask application tests
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v


      # 9. Build Docker image
      - name: Build Docker image
        run: docker build -t student-performance-ml:${{ github.sha }} .


      # 10. Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name student-performance-ml-container \
            -p 5000:5000 \
            student-performance-ml:${{ github.sha }}


      # 11. Wait for Flask application
      - name: Wait for application
        run: sleep 10


      # 12. Test health endpoint
      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/


      # 13. Test prediction endpoint
      - name: Test prediction endpoint
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Sleep_Hours": 7.5,
              "Stress_Level": 5.0,
              "Previous_Exam_Scores": 75.0,
              "Study_Hours": 5.0
            }' \
            http://localhost:5000/predict


      # 14. Show Docker logs
      - name: Show Docker logs
        if: always()
        run: docker logs student-performance-ml-container


      # 15. Stop Docker container
      - name: Stop Docker container
        if: always()
        run: docker stop student-performance-ml-container || true


      # 16. Remove Docker container
      - name: Remove Docker container
        if: always()
        run: docker rm student-performance-ml-container || true


      # 17. Prepare release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate

          cp app.py release_candidate/
          cp student_performance_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf "Student Performance Prediction ML Application\nRun: python app.py\nHealth Endpoint: GET /\nPrediction Endpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt


      # 18. Upload release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: student-performance-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
