name: Student Performance ML CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7


      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'


      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip


      # 4. Install project dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt


      # 5. Train ML model
      - name: Train student performance model
        run: python train_model.py


      # 6. Check ML quality gate
      - name: Check ML quality gate
        run: python quality_gate.py


      # 7. Run ML pipeline tests
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v


      # 8. Run Flask application tests
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v


      # 9. Prepare Docker-ready release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate

          cp app.py release_candidate/
          cp student_performance_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf "Student Performance Prediction ML Application\nRun: python app.py\nHealth Endpoint: GET /\nPrediction Endpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt


      # 10. Upload Docker-ready release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: student-performance-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
