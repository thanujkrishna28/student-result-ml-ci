
name: Experiment 14 - Kubernetes CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image name
        id: image
        run: |
          echo "name=ghcr.io/thanujkrishna28/student-result-prediction:exp14-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy-to-minikube:
    needs: build-and-push

    runs-on:
      - self-hosted
      - Windows
      - X64

    permissions:
      contents: read
      packages: read

    steps:
      - name: Verify Kubernetes environment
        shell: powershell
        run: |
          docker version
          kubectl config current-context
          kubectl get nodes
          kubectl get deployment student-prediction

      - name: Authenticate to GHCR
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "GHCR authentication failed"
          }

      - name: Pull and load Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed"
          }

          minikube image load $env:IMAGE
          if ($LASTEXITCODE -ne 0) {
            throw "Minikube image load failed"
          }

      - name: Update Kubernetes deployment
        shell: powershell
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl patch deployment student-prediction --type=strategic -p '{"spec":{"template":{"spec":{"containers":[{"name":"student-result-prediction","imagePullPolicy":"IfNotPresent"}]}}}}'
          if ($LASTEXITCODE -ne 0) {
            throw "Image pull policy update failed"
          }

          kubectl set image deployment/student-prediction "student-result-prediction=$env:IMAGE"
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment image update failed"
          }

          kubectl rollout status deployment/student-prediction --timeout=300s
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed"
          }

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
          kubectl rollout history deployment/student-prediction
